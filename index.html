<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Mecsekhegyhát Programajánló</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      padding: 20px;
      text-align: center;
      background: white;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .flipbook-container {
      left: 0;
      width: 100%;
      height: 0;
      position: relative;
      padding-bottom: 156.25%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      background: white;
    }

    .flipbook-container iframe {
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      position: absolute;
      border: 0;
    }
  </style>
</head>

<body>
  <header>
    <h1>Mecsekhegyhát Programajánló</h1>
    <p>Lapozható online előnézet</p>
  </header>

  <main>
    <div class="flipbook-container">
      <iframe
        src="https://heyzine.com/flip-book/43f178dcd6.html"
        allowfullscreen
        scrolling="no"
        allow="clipboard-write *;">
      </iframe>
    </div>
  </main>
</body>
</html>
