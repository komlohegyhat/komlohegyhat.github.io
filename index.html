<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mecsekhegyhát Programajánló Könyv</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: white;
      text-align: center;
      padding: 32px 16px 24px 16px;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
    }

    header p {
      margin-top: 10px;
      font-size: 18px;
      color: #666;
    }

    main {
      max-width: 1000px;
      margin: 32px auto;
      padding: 0 16px 40px 16px;
    }

    .book-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
    }

    .book-title {
      margin: 0 0 16px 0;
      font-size: 22px;
      text-align: center;
    }

    .flipbook-wrapper {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: #eee;
    }

    .flipbook-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 14px;
      padding: 24px 16px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Mecsekhegyhát Programajánló Könyv</h1>
    <p>Lapozható online előnézet</p>
  </header>

  <main>
    <section class="book-box">
      <h2 class="book-title">Beágyazott Heyzine flipbook</h2>

      <div class="flipbook-wrapper">
        <iframe
          src="https://heyzine.com/flip-book/43f178dcd6.html"
          allowfullscreen
          scrolling="no"
          allow="clipboard-write *;">
        </iframe>
      </div>
    </section>
  </main>

  <footer>
    Mecsekhegyhát Programajánló
  </footer>

</body>
</html>
