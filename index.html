<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mecsekhegyhát Programajánló</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: white;
      text-align: center;
      padding: 32px 16px 24px 16px;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
    }

    header p {
      margin-top: 10px;
      font-size: 18px;
      color: #666;
    }

    main {
      max-width: 1000px;
      margin: 32px auto;
      padding: 0 16px 40px 16px;
    }

    .book-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
    }

    .book-title {
      margin: 0 0 16px 0;
      font-size: 22px;
      text-align: center;
    }

    .flipbook-wrapper {
      width: 100%;
      max-width: 850px;
      height: 600px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 8px;
      background: #eee;
    }

    .flipbook-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 1px solid lightgray;
      display: block;
    }

    .open-link {
      text-align: center;
      margin-top: 18px;
    }

    .open-link a {
      color: #1a5fd0;
      text-decoration: none;
      font-weight: 600;
    }

    .open-link a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 14px;
      padding: 24px 16px;
    }

    @media (max-width: 700px) {
      header h1 {
        font-size: 25px;
      }

      header p {
        font-size: 16px;
      }

      main {
        margin: 20px auto;
        padding: 0 12px 32px 12px;
      }

      .book-box {
        padding: 14px;
      }

      .book-title {
        font-size: 19px;
      }

      .flipbook-wrapper {
        height: 500px;
      }
    }

    @media (max-width: 480px) {
      .flipbook-wrapper {
        height: 420px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Mecsekhegyhát Programajánló</h1>
  </header>

  <main>
    <section class="book-box">
      <h2 class="book-title">Lapozható online előnézet</h2>

      <div class="flipbook-wrapper">
        <iframe
          allowfullscreen="allowfullscreen"
          allow="clipboard-write"
          scrolling="no"
          class="fp-iframe"
          src="https://heyzine.com/flip-book/43f178dcd6.html">
        </iframe>
      </div>

      <div class="open-link">
        <a href="https://heyzine.com/flip-book/43f178dcd6.html" target="_blank" rel="noopener noreferrer">
          Megnyitás teljes képernyőn / új lapon
        </a>
      </div>
    </section>
  </main>

  <footer>
    Mecsekhegyhát Programajánló
  </footer>

</body>
</html>
